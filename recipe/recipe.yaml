# WARNING external resources may need update as well
schema_version: 1

context:
  name: CoolProp
  version: "7.2.0"
  sha256: 83b3605a82250f2cd92fb608e121e16b2b618819c9ace7b8658b8bd3c1f64a31

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/CoolProp/${{ name }}/archive/v${{ version }}.tar.gz
    sha256: ${{ sha256 }}
  # patches:
  #   - setup.patch
  #   - rapidjson.patch
  # External dependencies
  # See https://github.com/CoolProp/CoolProp/tree/master/externals
  - url: https://github.com/CoolProp/IF97/archive/3ddd548f87f55db921a490ae4facb36162497009.tar.gz
    sha256: ba2ac3ffe69fc0045424eddc492b1a18041e45fefdcfaf6ea1f6ae9abc72cba8
    target_directory: externals/IF97
  - url: https://github.com/CoolProp/REFPROP-headers/archive/b4faab1b73911c32c4b69c526c7e92f74edb67de.zip
    sha256: a98351b3618e0f9f5dc95da219feaf55d029b5f5b961fdfb8262ad3e7e6e89a7
    target_directory: externals/REFPROP-headers

build:
  # pypy is not passing and we don't want to support it
  number: 0
  skip: python_impl == 'pypy'

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake >=3.15
    - if: not win
      then: make
      else: ninja
  host:
    - python
    - cython
    - scikit-build-core
    - pip
    - catch2
    - eigen
    - fmt =12.0.0
    - msgpack-c
    - msgpack-cxx
    - rapidjson
  run:
    - python
    - numpy >=1.2.0
    - matplotlib-base

tests:
  - python:
      imports:
        - CoolProp
        - CoolProp.tests
        - if: not match(python, ">=2,<3") or not linux
          then: CoolProp.Plots
        - CoolProp.GUI
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: Open-source thermodynamic and transport properties database
  description: |
    Open-source thermodynamic and transport properties database
  homepage: https://github.com/CoolProp/CoolProp
  repository: https://github.com/CoolProp/CoolProp
  documentation: http://www.coolprop.org/

extra:
  recipe-maintainers:
    - danilomendesdias
    - fcollonval
    - jan-janssen
